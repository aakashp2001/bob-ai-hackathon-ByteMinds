submission:
  title: "Missing Person Case Coordination" # REQUIRED — Project display name, e.g., "SmartOps Dashboard"

  problem_statement: >                 # REQUIRED — 1-3 sentences. What problem? Who has it?
    Investigators and case coordinators need a reliable way to organise family-provided
    missing-person information, witness tips, and CCTV descriptions without treating
    uncertain sightings as identity confirmation.

  solution_summary: >                  # REQUIRED — 1-3 sentences. What did you build?
    We built a fictional case coordination prototype using a deterministic FastAPI
    correlation engine, an MCP server for IBM Bob, and NVIDIA model generation for
    explanations, public appeals, and structured case files. The system preserves
    backend scores and source records while clearly presenting uncertainty and next actions.

  key_features:                        # REQUIRED — List 3 to 5 specific features you implemented
    - "Deterministic correlation and prioritised investigative leads"
    - "MCP tools for profiles, investigator tips, CCTV sightings, case data, and correlation results"
    - "NVIDIA AI-generated lead explanations with matching evidence, conflicts, uncertainty, and next actions"
    - "Verified-data public appeals and structured missing-person case files"
    - "Source record traceability with explicit identity-verification limitations"

  tech_stack:
    languages: ["Python", "JavaScript"] # REQUIRED — e.g., ["Python", "TypeScript"]
    frameworks: ["FastAPI", "Model Context Protocol SDK"] # e.g., ["FastAPI", "React"]
    ibm_technologies: ["IBM Bob"]       # e.g., ["watsonx.ai", "IBM Bob", "IBM Cloud Functions"]
    databases: []                        # e.g., ["PostgreSQL", "Redis"]
    other: ["NVIDIA API", "Node.js", "JSON", "GitHub Actions"] # e.g., ["Docker", "GitHub Actions", "Slack API"]

  what_we_are_most_proud_of: >         # Optional but recommended — guides judges to your best work
    The strongest part is the separation of responsibilities: the backend owns
    deterministic scoring, MCP preserves the source contract, and Bob plus the
    NVIDIA model provide explanations and documents without claiming identity confirmation.

  known_limitations: >                 # Optional but recommended — be honest about gaps
    This is a fictional prototype with mock data and no real police, CCTV, identity,
    biometric, or enforcement integrations. NVIDIA-generated text requires a configured
    API key and may require verification before use; the frontend and deployment are
    separate integration surfaces.

